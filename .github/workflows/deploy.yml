name: Deploy to GitHub Pages

# Every push to main builds the site and publishes it to
# https://maevisionary.github.io/brgy-181/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /brgy-181/
          # Test account (stored as repository secrets, never in the code).
          VITE_TEST_ACCOUNT_EMAIL: ${{ secrets.VITE_TEST_ACCOUNT_EMAIL }}
          VITE_TEST_ACCOUNT_PASSWORD_SHA256: ${{ secrets.VITE_TEST_ACCOUNT_PASSWORD_SHA256 }}
          VITE_TEST_ACCOUNT_2_EMAIL: ${{ secrets.VITE_TEST_ACCOUNT_2_EMAIL }}
          VITE_TEST_ACCOUNT_2_PASSWORD_SHA256: ${{ secrets.VITE_TEST_ACCOUNT_2_PASSWORD_SHA256 }}
      # Single-page app: unknown paths (e.g. /brgy-181/portal) load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
